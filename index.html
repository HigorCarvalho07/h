<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> SISTEMA MAGIC BR - Cofre de Decks</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .no-scroll { overflow: hidden; }
    .flip-container { perspective: 1000px; }
    .flip-inner { position: relative; width: 100%; transition: transform 0.7s; transform-style: preserve-3d; }
    .flip-inner.is-flipped { transform: rotateY(180deg); }
    .flip-front, .flip-back { width: 100%; backface-visibility: hidden; border-radius: 1rem; }
    .flip-back { position: absolute; top: 0; left: 0; transform: rotateY(180deg); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #0891b2; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 p-6 font-sans text-slate-200 min-h-screen">

  <!-- HEADER -->
  <header class="mb-10 text-center relative max-w-7xl mx-auto">
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-red-500 uppercase drop-shadow-[0_0_10px_rgba(34,211,238,0.4)]">
      SISTEMA MAGIC BR
    </h1>
    <p id="header-subtitle" class="mt-2 text-slate-400 italic">Selecione um Arquivo Tático</p>
  </header>

  <!-- TELA 1: GRID DE DECKS -->
  <div id="decks-view" class="max-w-7xl mx-auto">
    <div id="decks-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Decks gerados via JS -->
    </div>
  </div>

<!-- TELA 2: CARTAS DO DECK ESCOLHIDO (Escondida inicialmente) -->
  <div id="cards-view" class="hidden max-w-7xl mx-auto">
    
    <!-- Cabeçalho do Deck: Botão Voltar e Barra de Pesquisa -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6 md:mb-8">
      
      <!-- Botão Voltar -->
      <button onclick="closeDeck()" class="flex items-center justify-center gap-2 text-cyan-400 hover:text-cyan-300 transition-colors font-bold uppercase text-sm border border-cyan-400/30 bg-cyan-900/20 px-4 py-2 rounded-lg hover:bg-cyan-900/40 w-full md:w-auto shadow-[0_0_10px_rgba(34,211,238,0.1)]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Voltar aos Decks
      </button>
      
      <!-- Barra de Pesquisa -->
      <div class="relative w-full md:w-96">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-cyan-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <input type="text" id="search-input" oninput="filterCards()" placeholder="Buscar carta por nome ou tipo..." class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block pl-10 p-2.5 shadow-[0_0_10px_rgba(34,211,238,0.1)] outline-none transition-all placeholder-slate-500">
      </div>
      
    </div>
    
    <!-- Grid das Cartas -->
    <div id="cards-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
      <!-- Cartas geradas via JS -->
    </div>
  </div>

  <!-- MODAL DE DETALHES DA CARTA -->
  <div id="modal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-950/95 backdrop-blur-md">
    <button onclick="closeModal()" class="fixed top-4 right-4 z-50 p-2 bg-slate-800 hover:bg-red-600 rounded-full transition-colors text-white shadow-lg border border-slate-700">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <div class="min-h-screen p-4 md:p-8 flex justify-center pb-20">
      <div class="w-full max-w-5xl mt-8">
        <div class="flex flex-col lg:flex-row gap-8">
          <!-- Lado Esquerdo -->
          <div class="w-full lg:w-2/5 flex flex-col items-center shrink-0">
            <div class="flip-container relative w-full max-w-sm">
              <div id="modal-flip-inner" class="flip-inner">
                <img id="modal-img-front" src="" alt="" class="flip-front shadow-[0_0_30px_rgba(34,211,238,0.3)]">
                <img id="modal-img-back" src="" alt="" class="flip-back shadow-[0_0_30px_rgba(239,68,68,0.3)] hidden">
              </div>
            </div>
            <div id="flip-button-container" class="w-full mt-6 flex justify-center hidden">
              <button onclick="toggleFlip()" id="flip-btn-text" class="flex items-center justify-center w-full max-w-xs gap-2 py-3 px-6 rounded-lg bg-gradient-to-r from-cyan-600 to-cyan-800 hover:from-cyan-500 hover:to-cyan-700 text-white font-bold uppercase tracking-wide transition-all shadow-[0_0_15px_rgba(34,211,238,0.5)] border border-cyan-400/50">
                Virar Carta
              </button>
            </div>
          </div>
          <!-- Lado Direito -->
          <div class="w-full lg:w-3/5 text-slate-300">
            <h2 id="modal-title" class="text-3xl font-bold text-white mb-2">Nome</h2>
            <p id="modal-type" class="text-cyan-400 font-semibold mb-6 border-b border-slate-700 pb-4">Tipo</p>
            <div class="space-y-6">
              <div>
                <h3 class="text-sm font-bold uppercase text-slate-500 mb-2">Tradução</h3>
                <div id="modal-translation" class="bg-slate-900/80 p-4 rounded-lg border-l-4 border-cyan-500 italic whitespace-pre-line text-slate-300"></div>
              </div>
              <div>
                <h3 class="text-sm font-bold uppercase text-slate-500 mb-2">Explicação Tática</h3>
                <p id="modal-explanation" class="leading-relaxed bg-slate-900/50 p-4 rounded-lg border border-slate-800"></p>
              </div>
              <div>
                <h3 class="text-sm font-bold uppercase text-red-500 mb-2 flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                  Exemplo Prático
                </h3>
                <p id="modal-example" class="leading-relaxed bg-red-950/20 p-4 rounded-lg border border-red-900/50 text-slate-200"></p>
              </div>
              <div>
                <h3 class="text-sm font-bold uppercase text-amber-500 mb-2 flex items-center gap-2">

                  Observações
                </h3>
                <p id="modal-notes" class="leading-relaxed text-sm bg-amber-950/20 p-4 rounded-lg border border-amber-900/50 text-amber-200/90"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

          </div>
          <div class="p-6 relative z-10 -mt-12">
            <span class="inline-block px-3 py-1 bg-cyan-950 border border-cyan-700 text-cyan-400 text-xs font-bold uppercase rounded-full mb-3 shadow-[0_0_10px_rgba(34,211,238,0.2)]">
              ${deck.colors}
            </span>
            <h2 class="text-2xl font-bold text-white mb-1 group-hover:text-cyan-300 transition-colors">${deck.title}</h2>
            <p class="text-slate-400 text-sm">Comandante: <span class="text-slate-300">${deck.commander}</span></p>
            <div class="mt-4 flex items-center justify-between text-sm text-slate-500 border-t border-slate-800 pt-4">
              <span>${deck.cards.length} Cartas Cadastradas</span>
              <span class="text-cyan-500 font-bold group-hover:translate-x-1 transition-transform">Abrir &rarr;</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Abre um deck específico e mostra suas cartas
    function openDeck(index) {
      activeDeckIndex = index;
      decksView.classList.add('hidden');
      cardsView.classList.remove('hidden');
      headerSubtitle.innerText = `Arquivo Tático: ${decksDatabase[index].title}`;
      
      // Limpa a barra de pesquisa sempre que abrir o deck
      document.getElementById('search-input').value = '';
      
      renderCardsGrid();
      window.scrollTo(0, 0); 
    }

    // Fecha o deck e volta pra tela inicial
    function closeDeck() {
      activeDeckIndex = null;
      cardsView.classList.add('hidden');
      decksView.classList.remove('hidden');
      headerSubtitle.innerText = "Selecione um Arquivo Tático";
    }

    // Função da Barra de Pesquisa
    function filterCards() {
      const termo = document.getElementById('search-input').value;
      renderCardsGrid(termo);
    }

   // Renderiza as cartas (agora com filtro de busca e Atraso Controlado)
    function renderCardsGrid(searchTerm = "") {
      const currentDeckCards = decksDatabase[activeDeckIndex].cards;
      const term = searchTerm.toLowerCase();
      
      // Filtra pelo Nome ou pelo Tipo da carta
      const filteredCards = currentDeckCards.filter(card => {
        return card.name.toLowerCase().includes(term) || card.typeFront.toLowerCase().includes(term);
      });

      // Se não achar nada, mostra mensagem
      if (filteredCards.length === 0) {
        cardsGrid.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center text-slate-500 py-20">
            <svg class="h-12 w-12 text-slate-700 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <p>Nenhuma carta encontrada com "${searchTerm}"</p>
          </div>`;
        return;
      }

      // 1. GERA O HTML (Note que o src virou data-src e adicionamos a classe observe-img)
      cardsGrid.innerHTML = filteredCards.map(card => `
        <div onclick="openModal('${card.id}')" class="group relative cursor-pointer rounded-xl transition-all duration-300 hover:scale-105 hover:z-10 hover:shadow-[0_0_20px_rgba(239,68,68,0.5)] bg-slate-900 border border-slate-800">
          
          <img data-src="${card.imageFront}" alt="${card.name}" class="observe-img w-full aspect-[5/7] object-cover rounded-xl shadow-lg bg-slate-800">
          
          <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl flex items-center justify-center backdrop-blur-sm">
            <span class="text-cyan-400 font-bold uppercase tracking-wider text-sm border border-cyan-400 px-3 py-1 rounded">Acessar Dados</span>
          </div>
          ${card.isDoubleFaced ? `
            <div class="absolute top-2 right-2 bg-slate-900/90 rounded-full p-1 border border-cyan-500 shadow-[0_0_10px_rgba(34,211,238,0.5)]">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
            </div>
          ` : ''}
        </div>
      `).join('');

      // 2. MOTOR DE ATRASO (INTERSECTION OBSERVER) COM FILA GLOBAL
      const cardsToLoad = document.querySelectorAll('.observe-img');
      
      let currentDelay = 0; // Tempo de espera na fila
      let resetTimer = null; // Cronômetro para zerar a fila

      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            const img = entry.target;
            
            // Aplica o tempo exato de espera desta carta na fila
            setTimeout(() => {
              img.src = img.getAttribute('data-src');
            }, currentDelay); 
            
            // Aumenta a fila em 150ms para a PRÓXIMA carta
            currentDelay += 150; 
            
            observer.unobserve(img);
          }
        });

        // Limpa o cronômetro anterior e cria um novo.
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          currentDelay = 0;
        }, currentDelay + 100);

      }, {
        rootMargin: "0px 0px 300px 0px" 
      });

      // Aplica o vigia em todas as cartas geradas
      cardsToLoad.forEach(img => imageObserver.observe(img));
    }

// Abre o Modal buscando a carta pelo ID com proteção contra slots vazios
    function openModal(cardId) {
      // O "c &&" é a trava mágica: impede que o sistema leia espaços vazios
      currentCard = decksDatabase[activeDeckIndex].cards.find(c => c && c.id === cardId);
      
      if (!currentCard) return; // Segurança extra caso a carta não exista

      isFlipped = false;
      document.body.classList.add('no-scroll');
      modal.classList.remove('hidden');
      updateModalUI();
    }

    function closeModal() {
      document.body.classList.remove('no-scroll');
      modal.classList.add('hidden');
      currentCard = null;
    }

    function toggleFlip() {
      if (!currentCard.isDoubleFaced) return;
      isFlipped = !isFlipped;
      updateModalUI();
    }

    function updateModalUI() {
      const innerFlip = document.getElementById('modal-flip-inner');
      const imgFront = document.getElementById('modal-img-front');
      const imgBack = document.getElementById('modal-img-back');
      const flipBtnContainer = document.getElementById('flip-button-container');
      const flipBtnText = document.getElementById('flip-btn-text');
      
      imgFront.src = currentCard.imageFront;
      
      if (currentCard.isDoubleFaced) {
        imgBack.src = currentCard.imageBack || `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(currentCard.name.split(" // ")[0])}&format=image&version=normal&face=back`;
        imgBack.classList.remove('hidden');
        flipBtnContainer.classList.remove('hidden');
        
        if (isFlipped) {
          innerFlip.classList.add('is-flipped');
          flipBtnText.innerText = "Ver Face Frontal";
        } else {
          innerFlip.classList.remove('is-flipped');
          flipBtnText.innerText = "Virar Carta";
        }
      } else {
        imgBack.classList.add('hidden');
        flipBtnContainer.classList.add('hidden');
        innerFlip.classList.remove('is-flipped');
      }

      const isVerso = currentCard.isDoubleFaced && isFlipped;
      const nameArray = currentCard.name.split(" // ");
      document.getElementById('modal-title').innerText = isVerso ? (nameArray[1] || nameArray[0]) : nameArray[0];
      document.getElementById('modal-type').innerText = isVerso ? currentCard.typeBack : currentCard.typeFront;

      document.getElementById('modal-translation').innerText = isVerso ? currentCard.translationBack : currentCard.translationFront;
      document.getElementById('modal-explanation').innerText = isVerso ? currentCard.explanationBack : currentCard.explanationFront;
      document.getElementById('modal-example').innerText = isVerso ? (currentCard.exampleBack || currentCard.exampleFront) : currentCard.exampleFront;
      document.getElementById('modal-notes').innerText = isVerso ? (currentCard.notesBack || currentCard.notesFront) : currentCard.notesFront;
    }

    // Inicializa carregando a tela de decks
    renderDecks();
    
  </script>
</body>
</html>
